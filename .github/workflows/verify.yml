name: Verify

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  game:
    name: Game
    runs-on: windows-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: Game

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: Game/.nvmrc
          cache: npm
          cache-dependency-path: Game/package-lock.json

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Verify
        run: npm run verify

  server:
    name: Server
    runs-on: windows-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: Server

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: Server/.nvmrc
          cache: npm
          cache-dependency-path: Server/package-lock.json

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Verify
        run: npm run verify

  backend:
    name: Backend
    # Service containers (services:) GitHub поднимает только на Linux-раннере.
    # На windows-latest блок services не стартует, Postgres и Valkey для verify
    # не появляются — job остаётся на ubuntu-latest.
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: Backend

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: vsm
          POSTGRES_PASSWORD: vsm
          POSTGRES_DB: vsm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vsm -d vsm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      valkey:
        image: valkey/valkey:9
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      NODE_ENV: test
      PORT: "3000"
      DATABASE_URL: postgresql://vsm:vsm@127.0.0.1:5432/vsm
      # Без номера DB: хелпер тестов раздаёт наборам свои 2..6.
      REDIS_URL: redis://127.0.0.1:6379
      JWT_ACCESS_SECRET: local-dev-jwt-access-secret-32chars
      GAME_TICKET_SECRET: local-dev-game-ticket-secret-32ch
      GAME_SERVER_TOKEN: local-dev-game-server-token
      SEED_ENC_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      EXT_ID_PEPPER: local-dev-ext-id-pepper
      CORS_ORIGINS: http://127.0.0.1:5173
      PUBLIC_GAME_WS_URL: ws://127.0.0.1:3001/game
      COOKIE_SECURE: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: Backend/.nvmrc
          cache: npm
          cache-dependency-path: Backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Verify
        run: npm run verify

  client:
    name: Client
    runs-on: windows-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: Client

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: Client/.nvmrc
          cache: npm
          cache-dependency-path: Client/package-lock.json

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Verify
        run: npm run verify
