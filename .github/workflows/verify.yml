name: Verify

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  game:
    name: Game
    runs-on: windows-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: Game

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: Game/.nvmrc
          cache: npm
          cache-dependency-path: Game/package-lock.json

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Verify
        run: npm run verify

  server:
    name: Server
    runs-on: windows-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: Server

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: Server/.nvmrc
          cache: npm
          cache-dependency-path: Server/package-lock.json

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Verify
        run: npm run verify

  backend:
    name: Backend
    runs-on: windows-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: Backend

    env:
      DATABASE_URL: postgresql://vsm:vsm@127.0.0.1:5432/vsm

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: Backend/.nvmrc
          cache: npm
          cache-dependency-path: Backend/package-lock.json

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Verify
        run: npm run verify

  client:
    name: Client
    runs-on: windows-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: Client

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: Client/.nvmrc
          cache: npm
          cache-dependency-path: Client/package-lock.json

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Verify
        run: npm run verify
