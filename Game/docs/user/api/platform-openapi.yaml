openapi: 3.1.0
info:
  title: VSM Platform ↔ Game Server API
  version: 1.0.0
  description: |
    Service-to-service contract used by the Game Server to resolve a short-lived
    launch key into a game attempt and to persist the terminal result of that attempt.

    The Platform Server owns user authentication, attempt identity, persistent
    results and result pages. The Game Server owns the authoritative simulation and
    resolves gameLevelId against its local content.
servers:
  - url: https://platform.example
    description: Example Platform Server base URL
security:
  - platformServiceBearer: []
tags:
  - name: Game sessions
    description: Game Server integration endpoints.
paths:
  /api/game/sessions/resolve:
    post:
      tags: [Game sessions]
      operationId: resolveGameSession
      summary: Resolve a launch session key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveSessionRequest'
            example:
              key: opaque-session-key
      responses:
        '200':
          description: Session key accepted and resolved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResolveSessionResponse'
              examples:
                live:
                  value:
                    contractVersion: 1
                    attemptId: attempt-123
                    gameLevelId: vsm-baseline-01
                    mode:
                      kind: live
                guided:
                  value:
                    contractVersion: 1
                    attemptId: attempt-124
                    gameLevelId: vsm-baseline-01
                    mode:
                      kind: guided
                      hints:
                        immediateFeedback: true
                        suggestions: true
                        highlights: true
                        explanations: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/UnauthorizedService'
        '403':
          $ref: '#/components/responses/ForbiddenService'
        '404':
          description: Session key is unknown or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                contractVersion: 1
                code: invalid-session
                message: Session key is invalid or expired.
        '409':
          description: Attempt exists but cannot be started in its current state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '410':
          description: Session key was valid previously but is expired or permanently consumed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/game/sessions/{attemptId}/finish:
    post:
      tags: [Game sessions]
      operationId: finishGameSession
      summary: Persist the terminal game result
      description: |
        This operation MUST be idempotent by attemptId. Repeating the exact same
        terminal result returns the same receipt. A conflicting terminal payload for
        an already-finished attempt returns 409 and must not overwrite the result.
        `assessment` is optional. Bodies with it and without it are both valid.
        contractVersion stays 1. The Platform accepts the field first; the Game
        Server sends it only in this terminal body.
      parameters:
        - name: attemptId
          in: path
          required: true
          description: Must equal attemptId in the request body.
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinishedGameResult'
            examples:
              withoutAssessment:
                summary: A terminal body without assessment stays valid.
                value:
                  attemptId: attempt-123
                  content:
                    gameLevelId: vsm-baseline-01
                    gameLevelVersion: '1'
                    simulationCompatibilityVersion: '1'
                  rootSeed: '8745983467598346759'
                  userInputs:
                    - at: 1200000
                      sequence: 1
                      command:
                        type: move-to
                        cellId: carriage-01/cell-10
                  achievements:
                    setVersion: baseline-v2
                    ids: [inspected-extinguisher]
                  termination:
                    kind: route-completed
                    outcomeId: destination-arrived
                  scores:
                    safety: 96
                    customerSatisfaction: 84
              withAssessment:
                summary: The Game Server attaches assessment once, at the end.
                value:
                  attemptId: attempt-123
                  content:
                    gameLevelId: vsm-baseline-01
                    gameLevelVersion: '1'
                    simulationCompatibilityVersion: '1'
                  rootSeed: '8745983467598346759'
                  userInputs: []
                  achievements:
                    setVersion: baseline-v2
                    ids: []
                  termination:
                    kind: terminal-rule
                    outcomeId: wagon-unserviceable
                  scores:
                    safety: 90
                    customerSatisfaction: 60
                  assessment:
                    setVersion: baseline-v2
                    durationUs: 0
                    facts:
                      - id: journal-submission
                        kind: journal-submission
                        at: 0
                        verdict: incorrect
                        scoreDelta:
                          safety: -10
                          customerSatisfaction: -40
                        detail:
                          communication: ok
                          extinguisher: problem
                          climate: ok
                          emergencyBrake: ok
                          sanitation: clean
                          accepted: true
                          reportedProblem: true
                          realProblem: false
                          falseReport: true
                          missedProblem: false
      responses:
        '200':
          description: Result persisted or an identical result was already persisted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinishSessionResponse'
              example:
                contractVersion: 1
                resultId: result-456
                redirectUrl: https://platform.example/results/result-456
        '400':
          description: Invalid result or path/body attempt ID mismatch.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedService'
        '403':
          $ref: '#/components/responses/ForbiddenService'
        '404':
          description: Attempt ID does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: A different terminal result is already stored for this attempt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                contractVersion: 1
                code: result-conflict
                message: A different terminal result is already stored for this attempt.
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
components:
  securitySchemes:
    platformServiceBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque-service-token
      description: Service credential used by Game Server instances, not a user session key.
  responses:
    BadRequest:
      description: Request body or parameters are invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnauthorizedService:
      description: Missing or invalid Game Server service credential.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ForbiddenService:
      description: Authenticated service is not permitted to call this API.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Unexpected Platform Server failure.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnavailable:
      description: Platform Server is temporarily unable to service the request.
      headers:
        Retry-After:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ContractVersion:
      type: integer
      const: 1
      description: Platform ↔ Game Server HTTP contract version.
    ResolveSessionRequest:
      type: object
      additionalProperties: false
      required: [key]
      properties:
        key:
          type: string
          minLength: 1
          description: Opaque short-lived launch key issued by Platform Server to the browser.
    ResolveSessionResponse:
      type: object
      additionalProperties: false
      required: [contractVersion, attemptId, gameLevelId, mode]
      properties:
        contractVersion:
          $ref: '#/components/schemas/ContractVersion'
        attemptId:
          type: string
          minLength: 1
        gameLevelId:
          type: string
          minLength: 1
          description: ID resolved by Game Server against its local versioned content.
        mode:
          $ref: '#/components/schemas/SessionMode'
    SessionMode:
      oneOf:
        - $ref: '#/components/schemas/LiveMode'
        - $ref: '#/components/schemas/GuidedMode'
        - $ref: '#/components/schemas/ReplayMode'
      discriminator:
        propertyName: kind
    LiveMode:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind:
          const: live
    GuidedMode:
      type: object
      additionalProperties: false
      required: [kind, hints]
      properties:
        kind:
          const: guided
        hints:
          $ref: '#/components/schemas/HintPolicy'
    HintPolicy:
      type: object
      additionalProperties: false
      required: [immediateFeedback, suggestions, highlights, explanations]
      properties:
        immediateFeedback: { type: boolean }
        suggestions: { type: boolean }
        highlights: { type: boolean }
        explanations: { type: boolean }
    ReplayMode:
      type: object
      additionalProperties: false
      required: [kind, source, reveal]
      properties:
        kind:
          const: replay
        source:
          $ref: '#/components/schemas/ReplaySource'
        reveal:
          $ref: '#/components/schemas/ReplayRevealPolicy'
    ReplaySource:
      type: object
      additionalProperties: false
      required: [simulationCompatibilityVersion, gameLevelVersion, rootSeed, userInputs]
      properties:
        simulationCompatibilityVersion:
          type: string
          minLength: 1
        gameLevelVersion:
          type: string
          minLength: 1
        rootSeed:
          type: string
          minLength: 1
        userInputs:
          type: array
          items: {}
          description: Stored authoritative input log for replay.
    ReplayRevealPolicy:
      type: object
      additionalProperties: false
      required: [traits, actionLogits, hiddenObjectState, assessment, explanations]
      properties:
        traits: { type: boolean }
        actionLogits: { type: boolean }
        hiddenObjectState: { type: boolean }
        assessment: { type: boolean }
        explanations: { type: boolean }
    FinishedGameResult:
      type: object
      additionalProperties: false
      required: [attemptId, content, rootSeed, userInputs, achievements, termination, scores]
      properties:
        attemptId:
          type: string
          minLength: 1
        content:
          $ref: '#/components/schemas/FinishedContentVersion'
        rootSeed:
          type: string
          minLength: 1
        userInputs:
          type: array
          items: {}
          description: Preserve this authoritative game-specific JSON log without interpreting it.
        achievements:
          allOf:
            - $ref: '#/components/schemas/AchievementResult'
          description: Versioned Game Server assessment achievements. The baseline evaluator currently emits setVersion `baseline-v2`; consumers must treat IDs as opaque stable identifiers within that set version.
        termination:
          $ref: '#/components/schemas/TerminationResult'
        scores:
          allOf:
            - $ref: '#/components/schemas/ScoreResult'
          description: Final Game Server assessment scores. They are derived from authoritative gameplay facts and are not supplied by the browser.
        assessment:
          allOf:
            - $ref: '#/components/schemas/FinishedAssessment'
          description: |
            Optional terminal assessment facts. Omit the property entirely for a body the Platform already accepted before this field existed. When present, scores.safety equals clamp(startingScore + the sum of facts.scoreDelta.safety), and the same holds for customerSatisfaction. clamp rounds to the nearest integer, then limits the result to 0..100. startingScore comes from the attempt assessment configuration (100 in the baseline) and is not a field of this body. Any score override, including the safe pre-departure minimum, is included in the corresponding fact's scoreDelta. facts are ordered by at, then id. The Platform must accept bodies with and without this property. contractVersion stays 1. Rollout order is Platform first, Game second.
    FinishedContentVersion:
      type: object
      additionalProperties: false
      required: [gameLevelId, gameLevelVersion, simulationCompatibilityVersion]
      properties:
        gameLevelId:
          type: string
          minLength: 1
        gameLevelVersion:
          type: string
          minLength: 1
        simulationCompatibilityVersion:
          type: string
          minLength: 1
    AchievementResult:
      type: object
      additionalProperties: false
      required: [setVersion, ids]
      properties:
        setVersion:
          type: string
          minLength: 1
        ids:
          type: array
          uniqueItems: true
          items:
            type: string
            minLength: 1
    TerminationResult:
      type: object
      additionalProperties: false
      required: [kind, outcomeId]
      properties:
        kind:
          type: string
          enum: [route-completed, terminal-rule]
        outcomeId:
          type: string
          minLength: 1
          description: Stable outcome ID; this field is not itself a safety evaluation.
    FinishedAssessment:
      type: object
      additionalProperties: false
      required: [setVersion, durationUs, facts]
      properties:
        setVersion:
          type: string
          minLength: 1
          description: Same value as achievements.setVersion. The baseline evaluator currently emits baseline-v2.
        durationUs:
          type: integer
          minimum: 0
          description: Authoritative simulation time at termination, in microseconds.
        facts:
          type: array
          items:
            $ref: '#/components/schemas/AssessmentFact'
    AssessmentFact:
      type: object
      additionalProperties: false
      required: [id, kind, at, verdict, scoreDelta, detail]
      properties:
        id:
          type: string
          minLength: 1
          description: Stable within the attempt, for example boarding:passenger-2 or fire:cabin-fire.
        kind:
          type: string
          enum:
            - journal-submission
            - boarding-decision
            - service-request
            - fire
            - pressure
            - emergency-brake
        at:
          type: integer
          minimum: 0
          description: Simulation microseconds when the fact was resolved or observed.
        verdict:
          type: string
          enum: [correct, late, incorrect, missed]
          description: |
            correct is the right action in time. late is the right action after the target time. incorrect is the wrong action. missed means the required action never happened.
        scoreDelta:
          $ref: '#/components/schemas/AssessmentScoreDelta'
        reactionUs:
          type: integer
          minimum: 0
          description: Optional reaction interval in microseconds, such as a service response or fire start to extinguish.
        detail:
          type: object
          description: |
            Flat kind-specific facts. Values are JSON primitives only. journal-submission carries communication, extinguisher, climate, emergencyBrake (unset|ok|problem), sanitation (unset|clean|issue), accepted, reportedProblem, realProblem, falseReport, missedProblem. boarding-decision carries passengerId, expected (admit|reject), actual (admit|reject). service-request carries passengerId when known, serviceClass (basic|comfort|business), timedOut, targetUs. fire carries incidentId, extinguished, critical. pressure carries incidentId, critical. emergency-brake carries sealRemoved, activated, hazardActive.
          additionalProperties:
            oneOf:
              - type: string
              - type: number
              - type: boolean
              - type: 'null'
    AssessmentScoreDelta:
      type: object
      additionalProperties: false
      required: [safety, customerSatisfaction]
      properties:
        safety:
          type: number
        customerSatisfaction:
          type: number
    ScoreResult:
      type: object
      additionalProperties: false
      description: Baseline assessment dimensions, each normalized to the inclusive range 0..100.
      required: [safety, customerSatisfaction]
      properties:
        safety:
          type: number
          minimum: 0
          maximum: 100
        customerSatisfaction:
          type: number
          minimum: 0
          maximum: 100
    FinishSessionResponse:
      type: object
      additionalProperties: false
      required: [contractVersion, resultId, redirectUrl]
      properties:
        contractVersion:
          $ref: '#/components/schemas/ContractVersion'
        resultId:
          type: string
          minLength: 1
        redirectUrl:
          type: string
          format: uri
          description: Absolute URL the browser may navigate to after terminal confirmation.
    ErrorResponse:
      type: object
      additionalProperties: true
      required: [contractVersion, code, message]
      properties:
        contractVersion:
          $ref: '#/components/schemas/ContractVersion'
        code:
          type: string
          minLength: 1
        message:
          type: string
          minLength: 1
        requestId:
          type: string
          description: Optional Platform Server correlation ID.
