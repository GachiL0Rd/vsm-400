# Знаки кабинета. Условие оставлено, если его закрывают факты vsm-train2-01.
# Факт игры: choiceId = kind, timerSec всегда null, deviation всегда false,
# stage только acceptance, boarding или enroute. scenarioId — gameLevelId,
# категории каталога у решения нет.
#
# Сняты: фактами уровня не выполняются.
# - first-aid: медицинского факта нет.
# - rare: deviation в фактах всегда false, отдельного «редкого» флага нет.
# - handover: стадии сдачи вагона нет.
# - seal: situation не содержит «пломб». Пломба стоп-крана снимается в пути,
#   это не верная приёмка.
#
# Условия переписаны на существующие факты:
# - before-boarding: верный journal-submission (нет ложной отметки и пропуска).
# - before-complaint: верный service-request и ноль пропущенных запросов.
# - cold-head: пять верных fire, pressure или emergency-brake. Половины таймера
#   нет: timerSec у факта всегда null.
# - pressure: верный pressure, давление не стало критическим.
# - detail: пять верных journal-submission. choiceId «full» игра не пишет.
# - three-calls: три верных service-request по истории. В одном рейсе уровня
#   не больше двух верных запросов: еда голодного и вода жаждущего.
# - report-in-time: три верных emergency-brake, кран при активной опасности.
# - prevented: порог 2. В уровне один пожар и одна утечка, prevented не бывает 3.
# - no-delay: условие прежнее. choiceId timeout из игры не приходит, поэтому
#   знак — любой завершённый рейс хотя бы с одним решением.

achievements:
  - code: before-boarding
    title: Журнал без ошибки
    description: Сдать журнал приёмки без ложной отметки и без пропуска реальной неисправности
    bonusPoints: 50
    rule:
      on: run.recorded
      type: condition
      where:
        stage: acceptance
        verdict: best
        choiceIncludes: journal-submission

  - code: before-complaint
    title: Запрос в срок
    description: Обслужить запрос пассажира в срок и не оставить в этом рейсе запрос без ответа
    bonusPoints: 40
    rule:
      on: run.recorded
      type: condition
      where:
        verdict: best
        choiceIncludes: service-request
        complaintsMax: 0

  - code: clean-sweep
    title: Чистый рейс
    description: Завершить рейс без пропущенных решений и без критического пожара и давления
    bonusPoints: 30
    rule:
      on: run.recorded
      type: condition
      where:
        outcome: completed
        missedMax: 0
        incidentsMax: 0
        minDecisions: 1

  - code: cold-head
    title: Пять угроз
    description: Пять раз потушить пожар до критического, удержать давление или привести стоп-кран при опасности
    bonusPoints: 60
    rule:
      on: run.recorded
      type: count
      total: 5
      where:
        verdict: best
        choices: [fire, pressure, emergency-brake]

  - code: streak
    title: Неделя в строю
    description: Семь дней подряд хотя бы один рейс
    bonusPoints: 70
    rule:
      on: run.recorded
      type: streak
      total: 7

  - code: pressure
    title: Давление удержано
    description: Не дать отклонению давления дойти до критического уровня
    bonusPoints: 50
    rule:
      on: run.recorded
      type: condition
      where:
        verdict: best
        choiceIncludes: pressure

  - code: detail
    title: Пять журналов
    description: Пять раз сдать журнал приёмки без ложной отметки и без пропуска неисправности
    bonusPoints: 40
    rule:
      on: run.recorded
      type: count
      total: 5
      where:
        stage: acceptance
        verdict: best
        choiceIncludes: journal-submission

  - code: three-calls
    title: Три запроса
    description: Три раза обслужить запрос еды или воды в срок
    bonusPoints: 45
    rule:
      on: run.recorded
      type: count
      total: 3
      where:
        verdict: best
        choiceIncludes: service-request

  - code: no-delay
    title: Рейс с решением
    description: Завершить рейс, в котором зафиксировано хотя бы одно решение
    bonusPoints: 25
    rule:
      on: run.recorded
      type: condition
      where:
        outcome: completed
        timeoutsMax: 0
        minDecisions: 1

  - code: steady-hand
    title: Держать порог
    description: Закончить рейс, удержав безопасность не ниже 80
    bonusPoints: 30
    rule:
      on: run.recorded
      type: condition
      where:
        outcome: completed
        minSafety: 80

  - code: report-in-time
    title: Стоп-кран по делу
    description: Три раза привести стоп-кран, когда на маршруте есть опасность
    bonusPoints: 35
    rule:
      on: run.recorded
      type: count
      total: 3
      where:
        verdict: best
        choiceIncludes: emergency-brake

  - code: prevented
    title: Оба под контролем
    description: В одном завершённом рейсе потушить пожар до критического и не дать давлению стать критическим
    bonusPoints: 35
    rule:
      on: run.recorded
      type: condition
      where:
        outcome: completed
        preventedMin: 2
